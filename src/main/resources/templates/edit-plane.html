<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагування літака | Airline Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        .form-control:focus { border-color: #3498db; box-shadow: 0 0 8px rgba(52, 152, 219, 0.3); }
        .form-control:invalid { border-color: #e74c3c; background-color: #fdf2f2; }
        .form-control:valid:not(:placeholder-shown) { border-color: #27ae60; background-color: #f2fdf5; }

        .card { border-radius: 12px; }
        .card-header { border-radius: 12px 12px 0 0 !important; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Редагування літака: <span class="fw-bold" th:text="${plane.model}"></span></h4>
        </div>
        <div class="card-body">

            <div th:if="${errorMessage}" class="alert alert-danger fw-bold shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/edit}" method="post">
                <input type="hidden" name="oldModelName" th:value="${plane.model}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Назва моделі</label>
                        <input type="text" class="form-control" name="model" th:value="${plane.model}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Виробник</label>
                        <input type="text" class="form-control" name="manufacturer" th:value="${plane.manufacturer}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Рік випуску</label>
                        <input type="number" class="form-control" name="yearOfManufacture" th:value="${plane.yearOfManufacture}" min="1900" max="2026" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Швидкість (км/год)</label>
                        <input type="number" step="0.1" class="form-control" name="maxSpeed" th:value="${plane.maxSpeed}" min="1" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Дальність (км)</label>
                        <input type="number" step="0.1" class="form-control" name="flightRange" th:value="${plane.flightRange}" min="1" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Пальне (л/км)</label>
                        <input type="number" step="0.1" class="form-control" name="fuelConsumption" th:value="${plane.fuelConsumption}" min="0.1" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Нова місткість (місць/тонн)</label>
                        <input type="number" step="0.1" class="form-control" name="specialValue" placeholder="Введіть значення" required>
                        <small class="text-muted">Обов'язково для оновлення</small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Рівень люксу</label>
                        <input type="number" class="form-control" name="luxuryLevel" min="1" max="5" value="5">
                        <small class="text-muted">Тільки для Private Jet</small>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-x-circle"></i> Скасувати
                    </a>
                    <button type="submit" class="btn btn-warning px-4 fw-bold">
                        <i class="bi bi-save"></i> Зберегти зміни
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
