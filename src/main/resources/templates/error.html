<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Помилка - Airline Fleet Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa;color: #212529;}
        .error-container { min-height: 100vh;display: flex;align-items: center;justify-content: center;}
        .error-card {text-align: center;padding: 50px;background: white;border-radius: 20px;box-shadow: 0 10px 30px rgba(0,0,0,0.05);}
        h1 {font-size: 120px;color: #0d6efd;margin-bottom: 0;font-weight: 700;}
        h2 {font-weight: 600;margin-bottom: 20px;}
        p {color: #6c757d;font-size: 18px;margin-bottom: 30px;}
        .btn-home {padding: 12px 35px;border-radius: 50px;font-weight: 500;letter-spacing: 0.5px;text-transform: uppercase;}
    </style>
</head>
<body>

<div class="error-container">
    <div class="error-card">
        <h1 th:text="${status}">500</h1>
        <h2 th:text="${error}">Упс! Щось пішло не так</h2>

        <p>На жаль, сталася помилка при обробці вашого запиту.</p>

        <div class="alert alert-light border" th:if="${message}">
            <small>Деталі: <span th:text="${message}">Текст помилки</span></small>
        </div>

        <a href="/" class="btn btn-primary btn-home">Повернутися на головну ✈️</a>
    </div>
</div>

</body>
</html>
